<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rich or Broke · Live scoreboard</title><meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#0A101E;min-height:100vh}main{max-width:1080px;margin:0 auto;padding:20px 14px 40px}.wait{color:#8B97B5;font:15px "Chakra Petch",system-ui;text-align:center;padding:80px 0}</style>
<script>
/* Rich or Broke scoreboard panel: one renderer shared by the live page and JARVIS HQ (YouTube Studio).
   robPanel(sb, {today, history, live}) -> HTML string. robMount(rootEl) wires the chart hover.
   sb = {t, totals:{views,subs,likes,comments,videos}, videos:[{id,title,views,likes,comments}], live_url} */
var ROB_CSS = `
.rob{--bg:#0E1526;--panel:#151F36;--line:#24304F;--ink:#EAF0FF;--ink2:#B7C1DB;--mute:#8B97B5;--gold:#F2C14E;--mint:#3DDC97;--goldd:#7A5A12;--mintd:#155C40;
 font-family:"Chakra Petch",ui-sans-serif,system-ui,sans-serif;color:var(--ink);background:var(--bg);border-radius:18px;padding:22px;position:relative;overflow:hidden;font-variant-numeric:tabular-nums}
.rob *{box-sizing:border-box}
.rob:before{content:"";position:absolute;inset:0;background:radial-gradient(700px 260px at 12% -10%,rgba(242,193,78,.13),transparent 70%),radial-gradient(600px 260px at 100% 0%,rgba(61,220,151,.10),transparent 70%);pointer-events:none}
.rob>*{position:relative}
.rob-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.rob-brand{font-weight:700;font-size:15px;letter-spacing:.02em}.rob-brand span{color:var(--gold)}
.rob-sync{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mute)}
.rob-dot{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 4px rgba(61,220,151,.15)}
.rob-dot.off{background:#E8665A;box-shadow:0 0 0 4px rgba(232,102,90,.15)}
.rob-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:14px}
@media(max-width:820px){.rob-grid{grid-template-columns:1fr}}
.rob-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.rob-h{font-size:13px;color:var(--ink2);margin:0 0 14px;font-weight:600}
.rob-lvl{display:flex;gap:18px;align-items:center}
.rob-badge{flex:none;width:92px;height:104px;display:grid;place-items:center;text-align:center;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
 background:linear-gradient(160deg,#FFE29A,var(--gold) 45%,#B9851B);color:#2A1C00}
.rob-badge b{display:block;font-size:34px;line-height:1}.rob-badge small{display:block;font-size:11px;font-weight:700;letter-spacing:.08em}
.rob-rank{font-size:24px;font-weight:700;line-height:1.1}.rob-sub{font-size:13px;color:var(--mute);margin-top:4px}
.rob-xp{margin-top:14px}
.rob-xpl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink2);margin-bottom:6px}
.rob-track{height:12px;border-radius:999px;background:#0B1122;border:1px solid var(--line);overflow:hidden}
.rob-fill{height:100%;border-radius:999px;min-width:6px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.rob-fill.g{background:linear-gradient(90deg,#C9962E,var(--gold))}.rob-fill.m{background:linear-gradient(90deg,#24A874,var(--mint))}
.rob-req{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline;margin-top:14px}
.rob-req:first-of-type{margin-top:0}
.rob-req .n{font-size:22px;font-weight:700}.rob-req .n small{font-size:13px;color:var(--mute);font-weight:500}
.rob-req .p{font-size:13px;color:var(--ink2);text-align:right}
.rob-req .rob-track{grid-column:1/-1;margin-top:6px}
.rob-req .togo{grid-column:1/-1;font-size:12px;color:var(--mute);margin-top:4px}
.rob-qhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px}
.rob-qpct{font-size:30px;font-weight:700;color:var(--gold);line-height:1}
.rob-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:14px 0}
@media(max-width:820px){.rob-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.rob-stat:last-child{grid-column:1/-1}}
.rob-stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.rob-stat .k{font-size:12px;color:var(--mute)}.rob-stat .v{font-size:24px;font-weight:700;margin-top:2px}
.rob-chip{display:inline-block;margin-top:4px;font-size:11.5px;padding:2px 8px;border-radius:999px;background:rgba(61,220,151,.12);color:var(--mint)}
.rob-chip.z{background:rgba(139,151,181,.12);color:var(--mute)}
.rob-two{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px}
@media(max-width:820px){.rob-two{grid-template-columns:1fr}}
.rob-two.one{grid-template-columns:1fr}
.rob-chart{position:relative}.rob-chart svg{display:block;width:100%;height:auto;overflow:visible}
.rob-tip{position:absolute;pointer-events:none;background:#0B1122;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;white-space:nowrap;transform:translate(-50%,-115%);opacity:0;transition:opacity .12s}
.rob-tip b{display:block;font-size:15px}
.rob-empty{color:var(--mute);font-size:13.5px;padding:28px 0;text-align:center}
.rob-row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.rob-row:first-child{border-top:0;padding-top:0}
.rob-rk{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:13px;background:#0B1122;color:var(--ink2);border:1px solid var(--line)}
.rob-rk.r1{background:linear-gradient(160deg,#FFE29A,#C9962E);color:#2A1C00;border:0}.rob-rk.r2{background:linear-gradient(160deg,#EEF2FA,#9AA6C2);color:#1B2235;border:0}.rob-rk.r3{background:linear-gradient(160deg,#F2B48A,#A5643A);color:#2B1406;border:0}
.rob-tt{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rob-vv{font-size:13.5px;font-weight:700;text-align:right}
.rob-meta{grid-column:2/-1;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mute)}
.rob-meta .rob-track{flex:1;height:6px}
.rob-ach{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.rob-a{display:flex;align-items:center;gap:8px;padding:7px 11px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:12.5px;color:var(--mute)}
.rob-a i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;background:#0B1122;border:1px solid var(--line)}
.rob-a.on{color:var(--ink);border-color:rgba(242,193,78,.45)}.rob-a.on i{background:var(--gold);color:#2A1C00;border:0}
.rob-path{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:16px}
.rob-step{text-align:center;font-size:11px;color:var(--mute)}
.rob-step i{display:block;height:6px;border-radius:3px;background:#0B1122;border:1px solid var(--line);margin-bottom:6px}
.rob-step.done i{background:var(--mint);border-color:var(--mint)}.rob-step.now{color:var(--gold);font-weight:700}.rob-step.now i{background:var(--gold);border-color:var(--gold)}
.rob-foot{font-size:12px;color:var(--mute);margin-top:14px;line-height:1.5}.rob-foot a{color:var(--mint)}
`;
var ROB_LEVELS = [[0, "Broke"], [1e3, "Hustler"], [1e4, "Earner"], [1e5, "Baller"], [1e6, "Mogul"], [1e7, "Partner"]];
function robFmt(n) { return n == null ? "—" : Number(n).toLocaleString("en-US"); }
function robShort(n) { return n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace(/\.0$/, "") + "M" : n >= 1e3 ? (n / 1e3).toFixed(n >= 1e4 ? 0 : 1).replace(/\.0$/, "") + "k" : String(Math.round(n)); }
function robEsc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function robPct(p) { return p >= 10 ? Math.floor(p) + "%" : p >= 1 ? p.toFixed(1) + "%" : p.toFixed(2) + "%"; }
function robPanel(sb, o) {
  o = o || {};
  var T = sb.totals, views = T.views || 0, subs = T.subs, B = o.today;
  var li = 0; ROB_LEVELS.forEach(function (l, i) { if (views >= l[0]) li = i; });
  var cur = ROB_LEVELS[li], nxt = ROB_LEVELS[li + 1];
  var xp = nxt ? 100 * (views - cur[0]) / (nxt[0] - cur[0]) : 100;
  var ps = subs == null ? 0 : Math.min(100, subs / 10), pv = Math.min(100, views / 1e5), pq = Math.min(ps, pv);
  var d = function (k) { if (!B || T[k] == null || B[k] == null) return ""; var x = T[k] - B[k]; return '<span class="rob-chip' + (x > 0 ? "" : " z") + '">' + (x > 0 ? "+" + robFmt(x) : "+0") + " today</span>"; };
  var vids = (sb.videos || []).slice().sort(function (a, b) { return b.views - a.views; }), top = vids.length ? Math.max(1, vids[0].views) : 1;
  var bestVid = vids.length ? vids[0].views : 0;
  var ach = [["First 1,000 views", views >= 1e3], ["First comment", (T.comments || 0) >= 1], ["10 subscribers", (subs || 0) >= 10], ["10,000 views", views >= 1e4],
    ["100 subscribers", (subs || 0) >= 100], ["A Short with 100k views", bestVid >= 1e5], ["1 million views", views >= 1e6], ["Partner Program", subs >= 1000 && views >= 1e7]];
  var t = new Date(sb.t), age = Math.round((Date.now() - t) / 6e4);
  var when = o.live ? "Updated from YouTube " + (age < 1 ? "just now" : age < 120 ? age + " min ago" : Math.round(age / 60) + " h ago") + " · page checks every minute"
    : "YouTube numbers as of " + t.toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  return '<div class="rob">' +
    '<div class="rob-top"><div class="rob-brand">Rich or Broke · <span>Monetization quest</span></div><div class="rob-sync"><span class="rob-dot' + (o.live && age > 240 ? " off" : "") + '"></span>' + robEsc(when) + '</div></div>' +
    '<div class="rob-grid">' +
      '<div class="rob-card"><div class="rob-lvl"><div class="rob-badge"><div><small>LEVEL</small><b>' + (li + 1) + '</b></div></div>' +
        '<div><div class="rob-rank">' + cur[1] + '</div><div class="rob-sub">' + (nxt ? robFmt(nxt[0] - views) + " views to level " + (li + 2) + " · " + nxt[1] : "Max level reached") + '</div></div></div>' +
        '<div class="rob-xp"><div class="rob-xpl"><span>' + robShort(cur[0]) + '</span><span>' + robFmt(views) + ' views</span><span>' + (nxt ? robShort(nxt[0]) : "") + '</span></div>' +
        '<div class="rob-track" role="progressbar" aria-label="Progress to next level" aria-valuenow="' + Math.round(xp) + '" aria-valuemin="0" aria-valuemax="100"><div class="rob-fill m" style="width:' + xp + '%"></div></div></div>' +
        '<div class="rob-path" aria-label="Level path">' + ROB_LEVELS.map(function (l, i) { return '<div class="rob-step' + (i < li ? " done" : i === li ? " now" : "") + '" title="' + robShort(l[0]) + ' views"><i></i>' + l[1] + '</div>'; }).join("") + '</div></div>' +
      '<div class="rob-card"><div class="rob-qhead"><div class="rob-h" style="margin:0">Get paid by YouTube (both required)</div><div class="rob-qpct">' + robPct(pq) + '</div></div>' +
        '<div class="rob-req"><div class="n">' + robFmt(subs) + ' <small>/ 1,000 subscribers</small></div><div class="p">' + robPct(ps) + '</div>' +
          '<div class="rob-track"><div class="rob-fill g" style="width:' + ps + '%"></div></div><div class="togo">' + (subs == null ? "Subscriber count hidden" : robFmt(Math.max(0, 1000 - subs)) + " to go") + '</div></div>' +
        '<div class="rob-req"><div class="n">' + robFmt(views) + ' <small>/ 10M Shorts views in 90 days</small></div><div class="p">' + robPct(pv) + '</div>' +
          '<div class="rob-track"><div class="rob-fill m" style="width:' + pv + '%"></div></div><div class="togo">' + robFmt(Math.max(0, 1e7 - views)) + " to go</div></div></div>" +
    '</div>' +
    '<div class="rob-stats">' + [["Views", "views"], ["Subscribers", "subs"], ["Likes", "likes"], ["Comments", "comments"], ["Videos", "videos"]].map(function (s) {
      return '<div class="rob-stat"><div class="k">' + s[0] + '</div><div class="v">' + robFmt(T[s[1]]) + '</div>' + d(s[1]) + '</div>'; }).join("") + '</div>' +
    '<div class="rob-two' + (o.history ? "" : " one") + '">' +
      (o.history ? '<div class="rob-card"><div class="rob-h">Total views over time</div><div class="rob-chart" data-rob-chart></div></div>' : "") +
      '<div class="rob-card"><div class="rob-h">Video leaderboard</div>' + (vids.length ? vids.slice(0, 8).map(function (v, i) {
        return '<div class="rob-row"><div class="rob-rk' + (i < 3 ? " r" + (i + 1) : "") + '">' + (i + 1) + '</div><div class="rob-tt" title="' + robEsc(v.title) + '">' + robEsc(v.title.replace(/\s*#\S+/g, "")) + '</div><div class="rob-vv">' + robFmt(v.views) + '</div>' +
          '<div class="rob-meta"><div class="rob-track"><div class="rob-fill m" style="width:' + Math.max(2, 100 * v.views / top) + '%"></div></div><span>' + robFmt(v.likes) + ' likes · ' + robFmt(v.comments) + ' comments</span></div></div>'; }).join("") : '<div class="rob-empty">No videos yet.</div>') + '</div>' +
    '</div>' +
    '<div class="rob-ach">' + ach.map(function (a) { return '<div class="rob-a' + (a[1] ? " on" : "") + '"><i>' + (a[1] ? "✓" : "") + '</i>' + a[0] + '</div>'; }).join("") + '</div>' +
    '<div class="rob-foot">' + (o.live ? 'Real numbers from the YouTube Data API, sent every 2 hours and right after each new post. "Today" starts at the first update after midnight Eastern. Quest views use the channel total, which equals the last 90 days while the channel is under 90 days old; YouTube counts only qualified views.'
      : 'Live version, with today\'s gains and a views chart: <a href="' + robEsc(sb.live_url) + '" target="_blank" rel="noopener">' + robEsc(sb.live_url) + '</a>') + '</div>' +
  '</div>';
}
function robChart(el, h) {
  if (!el) return;
  if (!h || h.length < 2) { el.innerHTML = '<div class="rob-empty">The chart fills in after the next update.</div>'; return; }
  var W = Math.max(300, Math.min(760, el.clientWidth || 640)), H = W < 480 ? 210 : 240, L = 46, R = 14, Tp = 14, Bt = 30;
  var max = Math.max.apply(null, h.map(function (p) { return p.views; })), min = Math.min.apply(null, h.map(function (p) { return p.views; }));
  var step = Math.pow(10, Math.floor(Math.log10(Math.max(1, max - min || max)))), lo = Math.max(0, Math.floor(min / step) * step), hi = Math.ceil(max / step) * step; if (hi === lo) hi = lo + step;
  var t0 = h[0].t, t1 = h[h.length - 1].t;
  var X = function (t) { return L + (W - L - R) * (t - t0) / ((t1 - t0) || 1); }, Y = function (v) { return Tp + (H - Tp - Bt) * (1 - (v - lo) / (hi - lo)); };
  var pts = h.map(function (p) { return [X(p.t), Y(p.views)]; });
  var path = "M" + pts.map(function (p) { return p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" L");
  var s = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Total views over time, from ' + robFmt(h[0].views) + " to " + robFmt(h[h.length - 1].views) + '">' +
    '<defs><linearGradient id="robg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3DDC97" stop-opacity=".28"/><stop offset="1" stop-color="#3DDC97" stop-opacity="0"/></linearGradient></defs>';
  for (var g = 0; g <= 4; g++) { var v = lo + (hi - lo) * g / 4, y = Y(v); s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '" stroke="#24304F" stroke-width="1"/><text x="' + (L - 8) + '" y="' + (y + 4) + '" fill="#8B97B5" font-size="11" text-anchor="end">' + robShort(v) + "</text>"; }
  var fmtD = function (t) { return new Date(t).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric" }); };
  s += '<text x="' + L + '" y="' + (H - 8) + '" fill="#8B97B5" font-size="11">' + fmtD(t0) + '</text><text x="' + (W - R) + '" y="' + (H - 8) + '" fill="#8B97B5" font-size="11" text-anchor="end">' + fmtD(t1) + "</text>";
  s += '<path d="' + path + " L" + pts[pts.length - 1][0] + " " + Y(lo) + " L" + pts[0][0] + " " + Y(lo) + 'Z" fill="url(#robg)"/>';
  s += '<path d="' + path + '" fill="none" stroke="#3DDC97" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  s += '<line data-x x1="0" x2="0" y1="' + Tp + '" y2="' + (H - Bt) + '" stroke="#8B97B5" stroke-width="1" opacity="0"/><circle data-c r="5" fill="#3DDC97" stroke="#151F36" stroke-width="2" opacity="0"/>';
  var lp = pts[pts.length - 1]; s += '<circle cx="' + lp[0] + '" cy="' + lp[1] + '" r="4.5" fill="#3DDC97" stroke="#151F36" stroke-width="2"/>';
  s += '<rect x="' + L + '" y="0" width="' + (W - L - R) + '" height="' + H + '" fill="transparent" data-hit/></svg><div class="rob-tip"></div>';
  el.innerHTML = s;
  var svg = el.querySelector("svg"), tip = el.querySelector(".rob-tip"), xl = svg.querySelector("[data-x]"), c = svg.querySelector("[data-c]");
  var move = function (ev) {
    var r = svg.getBoundingClientRect(), mx = (ev.clientX - r.left) * W / r.width, k = 0, bd = 1e9;
    pts.forEach(function (p, i) { var dd = Math.abs(p[0] - mx); if (dd < bd) { bd = dd; k = i; } });
    var p = pts[k]; xl.setAttribute("x1", p[0]); xl.setAttribute("x2", p[0]); xl.setAttribute("opacity", ".5"); c.setAttribute("cx", p[0]); c.setAttribute("cy", p[1]); c.setAttribute("opacity", "1");
    tip.innerHTML = "<b>" + robFmt(h[k].views) + " views</b>" + fmtD(h[k].t) + (h[k].subs != null ? " · " + robFmt(h[k].subs) + " subs" : "");
    tip.style.left = (p[0] * r.width / W) + "px"; tip.style.top = (p[1] * r.height / H) + "px"; tip.style.opacity = 1;
  };
  var hit = svg.querySelector("[data-hit]");
  hit.addEventListener("pointermove", move); hit.addEventListener("pointerleave", function () { tip.style.opacity = 0; xl.setAttribute("opacity", 0); c.setAttribute("opacity", 0); });
}

</script></head><body><main id="app"><div class="wait">Loading the scoreboard…</div></main>
<script>
(function(){var st=document.createElement("style");st.textContent=ROB_CSS;document.head.appendChild(st);
function load(){fetch("/yt",{cache:"no-store"}).then(function(r){return r.json()}).then(function(d){
 var app=document.getElementById("app");
 if(!d.latest){app.innerHTML='<div class="wait">Waiting for the first update from YouTube.</div>';return}
 var L=d.latest;app.innerHTML=robPanel({t:L.t,totals:L.totals,videos:L.videos},{today:d.today,history:d.history,live:true});
 robChart(app.querySelector("[data-rob-chart]"),d.history);
}).catch(function(){var s=document.querySelector(".rob-sync");if(s)s.lastChild.nodeValue=" Can't reach the scoreboard right now, retrying…"})}
load();setInterval(load,60000)})();
</script></body></html>
